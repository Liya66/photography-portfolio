<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Portfolio</title>
  <meta name="description" content="" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="dist/output.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;700&family=Nothing+You+Could+Do&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body data-page="about" data-title="About"
  class="bg-white dark:bg-black text-black dark:text-white min-h-screen px-5 md:px-20 opacity-0 transition-opacity duration-500">
  <header id="site-header" class="flex w-full pt-10 pb-1"></header>

  <main class="container mx-auto">
    <h1 class="text-4xl pt-10 pb-8 font-bold">ABOUT ME</h1>
    <div class="grid grid-cols-2 gap-14 md:gap-20">
      <div class="col-span-2 md:col-span-1">
        <div
          class="bg-white dark:bg-neutral-900 p-5 pb-28 m-6 md:m-12 shadow-lg border border-gray-100 dark:border-neutral-800 hover:rotate-0 transition duration-500 -rotate-6 relative">
          <img id="portrait" src="" alt="Portrait of the photographer"
            class="smooth-edges w-full aspect-square object-cover h-auto" />
          <div class="absolute bottom-0 left-0 right-0 text-center">
            <p class="text-gray-800 dark:text-slate-200 pb-7 text-6xl font-nothingyoucoulddo">me</p>
          </div>
        </div>
      </div>
      <section class="text-base mx-3 col-span-2 md:col-span-1 my-auto">
        <p class="text-3xl font-serif font-bold mb-6"><span id="greeting"></span> <span class="animate-wave">👋</span></p>
        <ul id="highlights" class="mb-6 space-y-1 font-signika text-lg"></ul>
        <div id="bio" class="space-y-4"></div>
        <a href="contact.html"
          class="inline-block mt-8 py-3 px-5 text-sm font-medium rounded-lg bg-black text-white dark:bg-white dark:text-black hover:opacity-80 transition">
          Get in touch
        </a>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="site.config.js"></script>
  <script src="js/site.js"></script>
  <script>
    (function () {
      const about = window.SITE.about;
      document.getElementById("portrait").src = about.portrait;
      document.getElementById("greeting").textContent = about.greeting;
      const highlights = document.getElementById("highlights");
      (about.highlights || []).forEach((text) => {
        const li = document.createElement("li");
        li.textContent = text;
        li.className = "before:content-['—'] before:mr-2 before:text-gray-400";
        highlights.appendChild(li);
      });
      const bio = document.getElementById("bio");
      about.paragraphs.forEach((text) => {
        const p = document.createElement("p");
        p.textContent = text;
        bio.appendChild(p);
      });
    })();
  </script>
</body>

</html>
