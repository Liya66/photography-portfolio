<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Portfolio</title>
  <meta name="description" content="" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="dist/output.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;700&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body data-page="contact" data-title="Contact"
  class="bg-white dark:bg-black text-black dark:text-white min-h-screen px-5 md:px-20 opacity-0 transition-opacity duration-500">
  <header id="site-header" class="flex w-full pt-10 pb-1"></header>

  <main class="container mx-auto">
    <div class="grid grid-cols-2 gap-16">
      <section class="col-span-2 md:col-span-1">
        <h1 class="text-4xl pt-10 pb-4 font-bold">CONTACT</h1>
        <p class="mb-8 text-gray-600 dark:text-gray-300">
          Bookings, prints, collaborations or just a hello — send me a message and I'll get back to you.
        </p>
        <!-- Handled by Netlify Forms: submissions appear in the Netlify dashboard under Forms. -->
        <form name="contact" method="POST" action="thank-you.html" data-netlify="true" netlify-honeypot="bot-field"
          class="space-y-6 max-w-screen-md">
          <input type="hidden" name="form-name" value="contact" />
          <p class="hidden"><label>Don't fill this out: <input name="bot-field" /></label></p>
          <div>
            <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">Your name</label>
            <input type="text" id="name" name="name" autocomplete="name" required class="block w-full p-2.5 text-sm rounded-lg border shadow-sm bg-gray-50 border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-black focus:border-black dark:bg-neutral-900 dark:border-neutral-800 dark:text-white dark:placeholder-gray-400 dark:focus:ring-white dark:focus:border-white" />
          </div>
          <div>
            <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">Your email</label>
            <input type="email" id="email" name="email" autocomplete="email" required class="block w-full p-2.5 text-sm rounded-lg border shadow-sm bg-gray-50 border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-black focus:border-black dark:bg-neutral-900 dark:border-neutral-800 dark:text-white dark:placeholder-gray-400 dark:focus:ring-white dark:focus:border-white"
              placeholder="you@example.com" />
          </div>
          <div>
            <label for="subject" class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">What's it about?</label>
            <select id="subject" name="subject" class="block w-full p-2.5 text-sm rounded-lg border shadow-sm bg-gray-50 border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-black focus:border-black dark:bg-neutral-900 dark:border-neutral-800 dark:text-white dark:placeholder-gray-400 dark:focus:ring-white dark:focus:border-white">
              <option>Portrait session</option>
              <option>Event photography</option>
              <option>Print purchase</option>
              <option>Collaboration</option>
              <option>Something else</option>
            </select>
          </div>
          <div>
            <label for="message" class="block mb-2 text-sm font-medium text-gray-900 dark:text-gray-300">Your message</label>
            <textarea id="message" name="message" rows="6" required class="block w-full p-2.5 text-sm rounded-lg border shadow-sm bg-gray-50 border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-black focus:border-black dark:bg-neutral-900 dark:border-neutral-800 dark:text-white dark:placeholder-gray-400 dark:focus:ring-white dark:focus:border-white"
              placeholder="Tell me a little about what you have in mind…"></textarea>
          </div>
          <button type="submit"
            class="py-3 px-5 text-sm font-medium rounded-lg bg-black text-white dark:bg-white dark:text-black hover:opacity-80 transition">
            Send message
          </button>
        </form>
      </section>
      <div class="col-span-2 md:col-span-1 flex items-center">
        <div
          class="bg-white dark:bg-neutral-900 p-5 pb-20 m-6 md:m-12 shadow-lg border border-gray-100 dark:border-neutral-800 hover:rotate-0 transition duration-500 rotate-6">
          <img id="contact-photo" src="" alt="A red panda, photographed by Liya Wang" class="aspect-square w-full object-cover h-auto" />
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="site.config.js"></script>
  <script src="js/site.js"></script>
  <script>
    document.getElementById("contact-photo").src = window.SITE.contactPhoto;
  </script>
</body>

</html>
